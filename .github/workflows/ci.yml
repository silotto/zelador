name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --os="*" --cpu="*"
      - run: bun run typecheck
      - run: bun test
      - run: bash -n install.sh
      - name: Build (smoke)
        run: bun run build x64 && ./dist/zela-linux-x64 --version
